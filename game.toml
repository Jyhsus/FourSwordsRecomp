# game.toml — The Legend of Zelda: A Link to the Past & Four Swords (USA)
#
# FourSwordsRecomp only targets the Four Swords half of this cartridge, but
# the recompiler works on the whole, unmodified ROM image (AZLE). The A Link
# to the Past half is skipped at runtime (see docs/DESIGN.md, "Boot straight
# into Four Swords"), never removed from the player's ROM.
#
# Values here are verified against the player's dump. Do not copy addresses
# from other games: they describe a different binary.

[game]
name       = "The Legend of Zelda: Four Swords"
short_name = "four_swords"

[program]
name           = "The Legend of Zelda: A Link to the Past & Four Swords (USA)"
id             = "AZLE"
load_address   = 0x08000000
size           = 0x00800000
entry_pc       = 0x08000000
speculative_literal_harvest = false
# Code occupies ~0x08000000-0x0813FFFF; everything above is data (graphics,
# maps, audio). A whole-ROM AOT scan treats that data as code and needs >6 GB
# of RAM, so the AOT pointer-table scan is left off for now: discovery starts
# from the entry point, and anything it misses is interpreted on first use and
# cached natively by the runtime. Limiting it to 0x08000000-0x08140000 is no
# better: data inside that range still decodes as ~490k "functions" (~20 GB
# peak, 22 Oct 2026). Callback tables are declared by hand below instead.
# aot_scan_start = 0x08000000
# aot_scan_end   = 0x08140000
static_resume_all = true
codegen_shards = 32

[identity]
sha1 = "a272055abbbf6c26b0cd54c87395d01699589161"
md5  = "3287ca66e5cc285a9fe3a922051e84c6"

[bios]
path = "gbarecomp/bios/gba_bios.bin"
sha1 = "300c20df6731a33952ded8c436f7f186d25d3492"
hle  = false

[rom]
path = "roms/zelda_lttp_four_swords_usa.gba"
sha1 = "a272055abbbf6c26b0cd54c87395d01699589161"

# Library string EEPROM_V122 at 0x08427298; the dump's save is 8 KiB,
# i.e. a 64 Kbit EEPROM.
[save]
type = "eeprom"
size = 8192
path = "saves/four_swords_usa.sav"

# Top-level game-mode table, indexed by the byte at 0x03006D10 from the main
# loop at 0x0800B1B2 and called through _call_via_r0 (0x08135FE8), so the
# finder cannot see it. Modes seen so far: 8 = file select ("CHOOSE A FILE"),
# 6 = "CHOOSE A GAME" (0x0803074C), 9 = Four Swords, 13 = A Link to the Past.
[[jump_table]]
addr         = 0x0842731C
stride       = 4
count        = 14
format       = "abs32"
entries_mode = "auto"
name         = "game_mode_handlers"

# "CHOOSE A GAME" sub-state handlers, indexed by the byte at 0x03005050 from
# mode 6. Without this table and the one above, picking a file ran these
# through the self-heal interpreter bridge, which never reached its stop PC
# and aborted after 200M instructions (pc 0x348, BIOS IntrWait).
[[jump_table]]
addr         = 0x08427948
stride       = 4
count        = 7
format       = "abs32"
entries_mode = "auto"   # entries carry the Thumb bit; "thumb" would decode at odd PCs
name         = "choose_game_state_handlers"

# m4a (Sappy) sound driver. Its sequencer command handlers are called through
# a RAM copy of this table at 0x02031A30 (a few entries replaced by the game;
# 0x02031AB8/0x02031ABC are entries 34/35, 0-based), so the finder never sees
# them. Bridged, they leaked call-return entries (0x08134A66 /
# 0x08134A7A) until the runtime aborted with a call-return stack overflow.
[[jump_table]]
addr         = 0x083C2654
stride       = 4
count        = 36
format       = "abs32"
entries_mode = "auto"
name         = "m4a_jump_table"

# IRQ handler table: 13 words at 0x0842735C, DMA-copied to 0x03000B70 by
# 0x0800B6D0. Entry 0 (VBlank) points to EWRAM code (0x02030591) and is left
# out; the other 12 are ROM Thumb handlers. 0x08427390 starts another table.
[[jump_table]]
addr         = 0x08427360
stride       = 4
count        = 12
format       = "abs32"
entries_mode = "auto"
name         = "irq_handlers_from_hblank"

# Three Thumb callbacks after the null at 0x08427578 (the six before it are
# already found). 0x08011E5C and 0x080122C0 were bridged on the Four Swords
# path; no code literal points at this group.
[[jump_table]]
addr         = 0x0842757C
stride       = 4
count        = 3
format       = "abs32"
entries_mode = "auto"
name         = "callbacks_0842757c"

# m4a entries reached only through RAM pointers or from the VBlank code.
[[extra_func]]
addr = 0x081346FC
mode = "thumb"
name = "m4aSoundMain"

[[extra_func]]
addr = 0x081339D4
mode = "thumb"
name = "SoundMain"

[[extra_func]]
addr = 0x08134074
mode = "thumb"
name = "MPlayMain"   # address taken at 0x08134E38

[[extra_func]]
addr = 0x0800B7FC
mode = "thumb"
note = "calls m4aSoundMain; reached from the VBlank code in EWRAM"

# ARM routine copied to IWRAM at boot (CpuSet at 0x0800B106, 0x40 words) and
# reached through a function pointer once sound effects play. Bridged through
# the interpreter it never returned to its caller (0x08134A66) and aborted.
[[code_copy]]
runtime_start = 0x03005AE0
source_start  = 0x080008A8
size          = 0x100
name          = "iwram_arm_routine_5ae0"

[[extra_func]]
addr = 0x03005AE0
mode = "arm"

# The other ARM routines AgbMain copies to IWRAM with CpuSet (literal pool
# 0x0800B158-0x0800B180; each checked byte for byte against IWRAM). Single
# player reached them through the self-heal bridge; linked play has no bridge
# and stopped at 0x03000530 when Four Swords entered mode 5.
[[code_copy]]
runtime_start = 0x03000530
source_start  = 0x08008FA4
size          = 0x300
name          = "iwram_arm_0530"   # control 0x040000C0

[[extra_func]]
addr = 0x03000530
mode = "arm"

[[code_copy]]
runtime_start = 0x03000E40
source_start  = 0x080007C4
size          = 0x100
name          = "iwram_arm_0e40"   # control 0x04000040

[[extra_func]]
addr = 0x03000E40
mode = "arm"

[[code_copy]]
runtime_start = 0x03006740
source_start  = 0x0800023C
size          = 0xE0
name          = "iwram_arm_6740"   # control 0x04000038

[[extra_func]]
addr = 0x03006740
mode = "arm"

# m4a SoundMainRAM, copied to IWRAM by the sound init (CpuSet at 0x08134692,
# literals at 0x081346D8: source 0x08133A59, destination 0x03006D18, control
# 0x04000100 = 0x100 words). SoundMain calls it through the literal 0x03006D19
# at 0x08133A48. Thumb entry, ARM body from 0x03006D24 (add r1,pc,#4 at
# 0x03006D1E; bx r1), back to Thumb at 0x03006DA6 (add r0,pc,#0x2F at
# 0x03006D70; bx r0). It was the code bridged at
# 0x03006D18-0x03006E96 (not link code, as first assumed).
[[code_copy]]
runtime_start = 0x03006D18
source_start  = 0x08133A58
size          = 0x400
name          = "m4a_sound_main_ram"

[[extra_func]]
addr = 0x03006D18
mode = "thumb"
name = "SoundMainRAM"

[[extra_func]]
addr = 0x03006D24
mode = "arm"
note = "SoundMainRAM ARM body (bx r1 at 0x03006D20)"

[[extra_func]]
addr = 0x03006DA6
mode = "thumb"
note = "SoundMainRAM Thumb tail (bx r0 at 0x03006D74)"

# EWRAM code copied at boot by 0x0800C4xx (literal pool 0x0800C4D0). The
# multiplayer session has no interpreter fallback, so linked play stopped at
# 0x02030950 until these were declared.
# ARM: CpuSet 0x08000318 -> 0x02030950, control 0x04000010 (0x10 words).
# Its address is also stored from 0x0800C74C; it reads the cable's data
# registers (link IRQ path).
[[code_copy]]
runtime_start = 0x02030950
source_start  = 0x08000318
size          = 0x40
name          = "ewram_arm_link_irq"

[[extra_func]]
addr = 0x02030950
mode = "arm"

# Thumb: CpuSet 0x0800C7E9 -> 0x02030590, control 0x04000080 (0x80 words).
# 0x02030591 is the VBlank entry of the IRQ table at 0x0842735C.
[[code_copy]]
runtime_start = 0x02030590
source_start  = 0x0800C7E8
size          = 0x200
name          = "ewram_thumb_vblank"

[[extra_func]]
addr = 0x02030590
mode = "thumb"
name = "vblank_handler_ewram"

# Mode-6 ("CHOOSE A GAME") handler. Hooked by src/fs_boot.cpp to start Four
# Swords instead. Hooking set_game_mode (0x0800B5EC) would miss the inline
# mode-6 write AgbMain does after a soft reset (0x0803072C).
[[mod_function_hook]]
addr = 0x0803074C
mode = "thumb"
note = "choose-game mode handler; FSR direct boot into Four Swords"

# Screen reset. src/fs_boot.cpp uses AgbMain's call (return 0x0800B0CE), made
# right after the system block is loaded, to pick the file slot for --slot.
[[mod_function_hook]]
addr = 0x0800BED8
mode = "thumb"
note = "screen reset; FSR boot into a file slot"

# Four Swords quit step (lobby step 7 of 0x084278C0). src/fs_boot.cpp ends a
# launcher session here, or shows the stock "CHOOSE A GAME" without --slot.
[[mod_function_hook]]
addr = 0x08030018
mode = "thumb"
note = "Four Swords exit to mode 6; FSR return to launcher"

[runtime]
debug_port   = 19890
window_title = "FourSwordsRecomp"

[video]
screen = "frontlit"
widescreen = 0

[audio]
shadow = false
